name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compiler
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "error:|e: |What went wrong|FAILURE|Could not|ERROR" -A4 build.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
            { echo '```'; tail -80 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk TCO-Presences.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TCO-Presences-apk
          path: TCO-Presences.apk
      - name: Publier en téléchargement direct (onglet Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag 2>/dev/null || true
          gh release create derniere-version TCO-Presences.apk \
            --title "TCO Présences — dernière version" \
            --notes "APK compilé automatiquement le $(date -u +'%d/%m/%Y à %H:%M') UTC. Ouvrir ce lien depuis le téléphone Android pour l'installer." \
            --latest
