name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Préparer la clé de signature
        shell: bash
        env:
          PW: ${{ secrets.TCO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::error::Secret TCO_KEYSTORE_PASSWORD manquant : Settings > Secrets and variables > Actions > New repository secret (voir LISEZMOI.md)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/tco.jks.enc -out "$RUNNER_TEMP/tco.jks" -pass env:PW \
            || { echo "::error::Mot de passe TCO_KEYSTORE_PASSWORD incorrect."; exit 1; }
          echo "TCO_KEYSTORE_FILE=$RUNNER_TEMP/tco.jks" >> "$GITHUB_ENV"
      - name: Compiler
        shell: bash
        env:
          TCO_KEYSTORE_PASSWORD: ${{ secrets.TCO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "error:|e: |What went wrong|FAILURE|Could not|ERROR" -A4 build.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
            { echo '```'; tail -80 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk TCO-Presences.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TCO-Presences-apk
          path: TCO-Presences.apk
      - name: Publier en téléchargement direct (onglet Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag 2>/dev/null || true
          gh release create derniere-version TCO-Presences.apk \
            --title "TCO Présences — dernière version" \
            --notes "APK compilé automatiquement le $(date -u +'%d/%m/%Y à %H:%M') UTC. Ouvrir ce lien depuis le téléphone Android pour l'installer." \
            --latest
