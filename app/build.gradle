plugins {
    id 'com.android.application'
}

android {
    namespace 'bf.tco.presences'
    compileSdk 35

    defaultConfig {
        applicationId 'bf.tco.presences'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // Clé de signature permanente (fournie par la compilation GitHub, voir LISEZMOI.md).
    // Toujours la même clé : les mises à jour s'installent par-dessus sans perdre les données.
    def ks = System.getenv('TCO_KEYSTORE_FILE')
    signingConfigs {
        tco {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('TCO_KEYSTORE_PASSWORD')
                keyAlias 'tco'
                keyPassword System.getenv('TCO_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.tco
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Aligne les versions de la bibliothèque Kotlin tirées par AndroidX (évite les classes en double)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
