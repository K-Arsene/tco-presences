plugins {
    id 'com.android.application'
}

android {
    namespace 'bf.tco.presences'
    compileSdk 35

    defaultConfig {
        applicationId 'bf.tco.presences'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Pour une version signée, déclarer ici votre signingConfig (voir LISEZMOI.md).
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Aligne les versions de la bibliothèque Kotlin tirées par AndroidX (évite les classes en double)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
